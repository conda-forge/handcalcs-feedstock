schema_version: 1

context:
  name: handcalcs
  version: "2.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/handcalcs-${{ version }}.tar.gz
  sha256: 8423737827e0a0c1a7346bb4efcee1628b6f4431c5b0a96523721b0b473ab7b3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - flit
  run:
    - innerscope >=0.7.0
    - more-itertools
    - pyparsing
    - python >=${{ python_min }}
    - jinja2
    - pfst
    - platformdirs

tests:
  - python:
      imports:
        - handcalcs
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Converts your Python calculation script into beautifully rendered Latex,
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/connorferster/handcalcs

extra:
  recipe-maintainers:
    - connorferster
    - jan-janssen
